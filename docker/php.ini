; =============================================================================
; Owere & Associates — PHP configuration overrides (Docker)
; =============================================================================

upload_max_filesize = 25M
post_max_size       = 26M
max_execution_time  = 120
memory_limit        = 128M

; Display errors only in development (disable in production)
display_errors      = On
display_startup_errors = On
error_reporting     = E_ALL