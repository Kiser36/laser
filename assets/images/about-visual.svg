<svg xmlns="http://www.w3.org/2000/svg" width="640" height="736" viewBox="0 0 640 736">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#070F1D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C95C"/>
      <stop offset="1" stop-color="#A8872B"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="640" height="736" fill="url(#bg)"/>
  <rect width="640" height="736" fill="url(#grid)"/>

  <circle cx="520" cy="120" r="190" fill="url(#gold)" opacity="0.07"/>
  <circle cx="120" cy="640" r="240" fill="url(#gold)" opacity="0.05"/>

  <!-- Monument / skyline motif -->
  <g opacity="0.92">
    <path d="M470 500 470 330 522 392 470 392 Z" fill="url(#gold)" opacity="0.9"/>
    <rect x="360" y="380" width="26" height="120" fill="url(#gold)" opacity="0.55"/>
    <rect x="400" y="300" width="30" height="200" fill="url(#gold)" opacity="0.75"/>
    <rect x="500" y="420" width="24" height="80" fill="url(#gold)" opacity="0.45"/>
    <rect x="180" y="360" width="90" height="140" fill="url(#gold)" opacity="0.5"/>
    <rect x="250" y="420" width="70" height="80" fill="url(#gold)" opacity="0.35"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="118" cy="118" r="5" opacity="0.9"/>
    <circle cx="196" cy="92" r="3" opacity="0.5"/>
    <circle cx="160" cy="176" r="3.5" opacity="0.65"/>
    <circle cx="88" cy="200" r="2.5" opacity="0.4"/>
  </g>

  <!-- Accent frame -->
  <rect x="34" y="34" width="572" height="668" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.45"/>
  <rect x="46" y="46" width="548" height="644" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
</svg>
